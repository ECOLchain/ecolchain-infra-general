# oci-cli na VM: usado pelo refresh-images.sh para pedir um token temporário
# ao OCIR autenticado via instance principal (dynamic group + read repos).
- name: Instalar python3-pip
  ansible.builtin.shell: |
    rpm -q python3-pip >/dev/null 2>&1 || dnf install -y python3-pip
  args:
    executable: /bin/bash
  register: pip_pkg
  changed_when: pip_pkg.stdout is search("Installing|Installed:")

- name: Instalar oci-cli
  ansible.builtin.pip:
    name: oci-cli
    state: present
    executable: pip3
