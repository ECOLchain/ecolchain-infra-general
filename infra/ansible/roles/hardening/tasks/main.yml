# Hardening básico: firewall só com o necessário + SSH sem senha + updates de segurança.
# Guarda por rpm -q: uma corrida anterior do dnf pode deixar o pacote
# instalado fora do que o módulo enxerga ("Transaction test error:
# package X is already installed") — nesse caso rpm -q retorna 0 e pulamos.
- name: Instalar firewalld e dnf-automatic
  ansible.builtin.shell: |
    rpm -q firewalld dnf-automatic >/dev/null 2>&1 || dnf install -y firewalld dnf-automatic
  args:
    executable: /bin/bash
  register: hardening_pkgs
  changed_when: hardening_pkgs.stdout is search("Installing|Installed:")

- name: firewalld habilitado
  ansible.builtin.systemd:
    name: firewalld
    enabled: true
    state: started

# Porta da app aberta apenas para a VCN (o LB mora na mesma VCN);
# o mundo externo só enxerga o LB :443 (subnet) e o SSH :22 (default zone).
# firewall-cmd direto — sem depender de collection galaxy (ansible.posix).
# A rich rule precisa ser um único argumento quotado; `command` não faz
# shell, então o apply vai por `shell` (&& reload).
- name: Checar regra firewalld da porta da app
  ansible.builtin.command:
    cmd: "firewall-cmd --permanent --query-rich-rule='rule family=\"ipv4\" source address=\"{{ vcn_cidr }}\" port port=\"{{ mgmt_app_port }}\" protocol=\"tcp\" accept'"
  register: fw_app_rule
  changed_when: false
  failed_when: false

- name: Aplicar regra firewalld da porta da app
  ansible.builtin.shell: |
    firewall-cmd --permanent --add-rich-rule='rule family="ipv4" source address="{{ vcn_cidr }}" port port="{{ mgmt_app_port }}" protocol="tcp" accept' && firewall-cmd --reload
  args:
    executable: /bin/bash
  when: fw_app_rule.rc != 0

- name: SSH sem autenticação por senha
  ansible.builtin.lineinfile:
    path: /etc/ssh/sshd_config
    regexp: "^#?PasswordAuthentication"
    line: "PasswordAuthentication no"
  notify: Restart sshd

- name: SSH sem login de root
  ansible.builtin.lineinfile:
    path: /etc/ssh/sshd_config
    regexp: "^#?PermitRootLogin"
    line: "PermitRootLogin no"
  notify: Restart sshd

- name: dnf-automatic (download de updates de segurança)
  ansible.builtin.systemd:
    name: dnf-automatic.timer
    enabled: true
    state: started
