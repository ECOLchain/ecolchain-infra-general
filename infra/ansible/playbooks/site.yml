# Provisionamento completo da VM do runtime da management-api.
# Disparado pelo job de apply do CD (módulo management-api-runtime) com
# --extra-vars "@ansible_vars.json" (terraform output -json ansible_vars).
- name: Provisionamento da VM da management-api
  hosts: all
  become: true
  gather_facts: false
  vars:
    mgmt_envs:
      - dev
      - prod
    # 1 env por VM: porta da app aberta no firewall = a do env ativo.
    mgmt_app_port: "{{ app_dev.port if 'dev' in mgmt_envs else app_prod.port }}"

  pre_tasks:
    - name: Instalar python3 (imagem OL9 já traz, mas garante)
      ansible.builtin.raw: command -v python3 >/dev/null 2>&1 || dnf install -y python3 python3-pip
      changed_when: false

    - name: Coletar facts
      ansible.builtin.setup:

    - name: Esperar cloud-init terminar
      ansible.builtin.command: cloud-init status --wait
      changed_when: false
      failed_when: false

    # VMs E2.1.Micro (1GB): sem swap o dnf é OOM-killed (rc -9) na
    # resolução de dependências. Cria swapfile antes de qualquer dnf.
    - name: Garantir swap de 1.5G (VM Micro tem ~1GB RAM)
      ansible.builtin.shell: |
        if ! swapon --show=NAME --noheadings | grep -qx /swapfile; then
          rm -f /swapfile
          fallocate -l 1536M /swapfile &&
          chmod 600 /swapfile &&
          mkswap /swapfile &&
          swapon /swapfile
        fi
      args:
        executable: /bin/bash
      register: swap_out
      changed_when: swap_out.stdout is search("swapspace")

    - name: Persistir swap no fstab
      ansible.builtin.lineinfile:
        path: /etc/fstab
        line: "/swapfile none swap sw 0 0"
        regexp: ^/swapfile\s

  roles:
    - hardening
    - docker
    - ocir
    - mgmt_app
