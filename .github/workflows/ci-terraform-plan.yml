name: CI Terraform (Feature -> Plan & Auto-PR)

on:
  push:
    branches:
      - 'feature/**'
      - 'feat/**'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write
  pull-requests: write

env:
  AWS_ACCESS_KEY_ID: ${{ secrets.OCI_S3_ACCESS_KEY }}
  AWS_SECRET_ACCESS_KEY: ${{ secrets.OCI_S3_SECRET_KEY }}
  AWS_DEFAULT_REGION: sa-saopaulo-1
  AWS_REQUEST_CHECKSUM_CALCULATION: WHEN_REQUIRED
  AWS_RESPONSE_CHECKSUM_VALIDATION: WHEN_REQUIRED
  TF_VAR_cloudflare_email: ${{ secrets.CLOUDFLARE_EMAIL }}
  TF_VAR_cloudflare_api_key: ${{ secrets.CLOUDFLARE_API_KEY }}
  TF_VAR_cloudflare_zone_id: ${{ secrets.CLOUDFLARE_ZONE_ID }}
  TF_VAR_cloudflare_account_id: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
  TF_VAR_vercel_api_token: ${{ secrets.VERCEL_API_TOKEN }}
  TF_VAR_tenancy_ocid: ${{ secrets.OCI_TENANCY_OCID }}
  TF_VAR_user_ocid: ${{ secrets.OCI_USER_OCID }}
  TF_VAR_fingerprint: ${{ secrets.OCI_FINGERPRINT }}
  TF_VAR_basic_auth: ${{ secrets.DEV_FRONTEND_BASIC_AUTH }}
  TF_IN_AUTOMATION: '1'
  TF_INPUT: '0'

jobs:
  detect:
    name: Detect Changed Modules
    runs-on: ubuntu-latest
    outputs:
      dirs: ${{ steps.dirs.outputs.dirs }}
      count: ${{ steps.dirs.outputs.count }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Fetch main (diff base)
        run: git fetch --no-tags origin main

      - name: Detect changed modules
        id: dirs
        run: .github/scripts/detect-changed-modules.sh --three-dot origin/main HEAD

  terraform:
    name: Plan (${{ matrix.dir }})
    needs: detect
    if: ${{ needs.detect.outputs.count != '0' }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        dir: ${{ fromJSON(needs.detect.outputs.dirs) }}

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: '~> 1.13.0'

      - name: Write OCI API Key File
        run: |
          printf '%s' "${{ secrets.OCI_PRIVATE_KEY }}" > "$RUNNER_TEMP/oci_api_key.pem"
          chmod 600 "$RUNNER_TEMP/oci_api_key.pem"
          echo "TF_VAR_private_key_path=$RUNNER_TEMP/oci_api_key.pem" >> "$GITHUB_ENV"

      - name: Terraform Fmt Check
        run: terraform -chdir=${{ matrix.dir }} fmt -check -diff

      - name: Terraform Init
        run: terraform -chdir=${{ matrix.dir }} init -input=false

      - name: Terraform Validate
        run: terraform -chdir=${{ matrix.dir }} validate

      - name: Terraform Plan
        run: |
          SLUG=$(echo "${{ matrix.dir }}" | tr '/' '-')
          set -o pipefail
          terraform -chdir=${{ matrix.dir }} plan -detailed-exitcode -input=false -no-color 2>&1 | tee "$RUNNER_TEMP/plan-$SLUG.txt"
          CODE=${PIPESTATUS[0]}
          # 0 = sem mudancas, 2 = plano com mudancas (ok), 1 = erro (falha)
          if [ "$CODE" -eq 1 ]; then
            exit 1
          fi
          echo "$CODE" > "$RUNNER_TEMP/status-$SLUG.txt"
          echo "MODULE_SLUG=$SLUG" >> "$GITHUB_ENV"

      - name: Upload Plan Output
        uses: actions/upload-artifact@v4
        with:
          name: plan-${{ env.MODULE_SLUG }}
          path: ${{ runner.temp }}/*-${{ env.MODULE_SLUG }}.txt
          retention-days: 1

      - name: Append Plan to Job Summary
        if: always()
        run: |
          SLUG=$(echo "${{ matrix.dir }}" | tr '/' '-')
          {
            echo "### Terraform Plan — \`${{ matrix.dir }}\`"
            echo '```hcl'
            tail -c 200000 "$RUNNER_TEMP/plan-$SLUG.txt" 2>/dev/null || echo "(sem output de plan)"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  auto-pr:
    name: Auto PR Feature -> Main
    needs: [detect, terraform]
    if: ${{ always() && needs.detect.result == 'success' && (needs.terraform.result == 'success' || needs.terraform.result == 'skipped') }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Download Plan Outputs
        if: ${{ needs.detect.outputs.count != '0' }}
        uses: actions/download-artifact@v4
        with:
          pattern: plan-*
          path: plans/
          merge-multiple: true

      - name: Auto Create or Update PR to Main
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          MODULE_COUNT: ${{ needs.detect.outputs.count }}
        run: |
          BRANCH_NAME="${GITHUB_REF#refs/heads/}"

          PR_BODY="✨ **Terraform Plan executado com sucesso!**

          Os módulos alterados em \`infra/terraform\` passaram por \`fmt\`, \`validate\` e \`plan\`.
          Confira o resultado do plan de cada módulo no comentário abaixo (e o output completo no job summary do workflow).

          ---
          PR automático gerado pelo pipeline de CI após validação da branch \`$BRANCH_NAME\`.
          ⚠️ **Atenção:** após o merge, o pipeline de CD executará \`terraform apply\` na infraestrutura (módulos de produção exigem aprovação no environment \`prod\`)."

          if [ "$MODULE_COUNT" = "0" ]; then
            PR_BODY="✨ **CI executado — nenhum módulo Terraform alterado neste push.**

          ---
          PR automático gerado pelo pipeline de CI após validação da branch \`$BRANCH_NAME\`."
          fi

          EXISTING_PR=$(gh pr list --head "$BRANCH_NAME" --base main --json number --jq '.[0].number')

          if [ -z "$EXISTING_PR" ]; then
            echo "Criando novo PR de $BRANCH_NAME para main..."
            gh pr create \
              --head "$BRANCH_NAME" \
              --base main \
              --title "feat: $BRANCH_NAME" \
              --body "$PR_BODY" || echo "⚠️ Para criar PRs automáticos via GitHub Actions, ative a opção 'Allow GitHub Actions to create and approve pull requests' em Settings -> Actions -> General."
          else
            echo "Atualizando PR #$EXISTING_PR..."
            gh pr edit "$EXISTING_PR" --body "$PR_BODY" || true
          fi

          PR_NUMBER=$(gh pr list --head "$BRANCH_NAME" --base main --json number --jq '.[0].number')

          if [ -n "$PR_NUMBER" ] && [ "$MODULE_COUNT" != "0" ] && ls plans/plan-*.txt >/dev/null 2>&1; then
            COMMENT_FILE="$RUNNER_TEMP/plan-comment.md"
            RUN_URL="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"

            # Orcamento total ~58k chars (limite do comentario GH: ~64k);
            # cada modulo recebe no max 20k ou a cota igualitaria
            N=$(ls plans/plan-*.txt | wc -l | tr -d ' ')
            PER=$(( (58000 - 2000) / N ))
            [ "$PER" -gt 20000 ] && PER=20000

            {
              echo "## 📋 Resultado do Terraform Plan"
              echo ""
              echo "| Módulo | Status |"
              echo "|---|---|"
              for f in plans/plan-*.txt; do
                MODULE=$(basename "$f" .txt | sed 's/^plan-//')
                CODE=$(cat "plans/status-$MODULE.txt" 2>/dev/null || echo "?")
                SUMMARY=$(grep -E '^(Plan:|No changes)' "$f" | head -1 | tr -d '\r')
                case "$CODE" in
                  0) ST="✅ Sem mudanças" ;;
                  2) ST="🔶 Com mudanças" ;;
                  *) ST="❓" ;;
                esac
                echo "| \`$MODULE\` | $ST${SUMMARY:+ — \`$SUMMARY\`} |"
              done
              echo ""
              for f in plans/plan-*.txt; do
                MODULE=$(basename "$f" .txt | sed 's/^plan-//')
                echo "<details><summary>📦 <code>$MODULE</code></summary>"
                echo ""
                echo '```hcl'
                tail -c "$PER" "$f"
                echo '```'
                echo "</details>"
                echo ""
              done
              echo "📄 [Log completo do plan no workflow run]($RUN_URL)"
            } > "$COMMENT_FILE"
            gh pr comment "$PR_NUMBER" --body-file "$COMMENT_FILE" || echo "⚠️ Falha ao comentar o plan no PR."
          fi
