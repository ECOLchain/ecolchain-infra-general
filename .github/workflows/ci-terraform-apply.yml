name: CD Terraform (Main -> Apply)

on:
  push:
    branches:
      - main

permissions:
  contents: read

env:
  AWS_ACCESS_KEY_ID: ${{ secrets.OCI_S3_ACCESS_KEY }}
  AWS_SECRET_ACCESS_KEY: ${{ secrets.OCI_S3_SECRET_KEY }}
  AWS_DEFAULT_REGION: sa-saopaulo-1
  AWS_REQUEST_CHECKSUM_CALCULATION: WHEN_REQUIRED
  AWS_RESPONSE_CHECKSUM_VALIDATION: WHEN_REQUIRED
  TF_VAR_cloudflare_email: ${{ secrets.CLOUDFLARE_EMAIL }}
  TF_VAR_cloudflare_api_key: ${{ secrets.CLOUDFLARE_API_KEY }}
  TF_VAR_cloudflare_zone_id: ${{ secrets.CLOUDFLARE_ZONE_ID }}
  TF_VAR_cloudflare_account_id: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
  TF_VAR_vercel_api_token: ${{ secrets.VERCEL_API_TOKEN }}
  TF_VAR_tenancy_ocid: ${{ secrets.OCI_TENANCY_OCID }}
  TF_VAR_user_ocid: ${{ secrets.OCI_USER_OCID }}
  TF_VAR_fingerprint: ${{ secrets.OCI_FINGERPRINT }}
  TF_VAR_basic_auth: ${{ secrets.DEV_FRONTEND_BASIC_AUTH }}
  TF_IN_AUTOMATION: '1'
  TF_INPUT: '0'

jobs:
  detect:
    name: Detect Changed Modules
    runs-on: ubuntu-latest
    outputs:
      prod_dirs: ${{ steps.dirs.outputs.prod_dirs }}
      prod_count: ${{ steps.dirs.outputs.prod_count }}
      nonprod_dirs: ${{ steps.dirs.outputs.nonprod_dirs }}
      nonprod_count: ${{ steps.dirs.outputs.nonprod_count }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Detect changed modules
        id: dirs
        run: .github/scripts/detect-changed-modules.sh "${{ github.event.before }}" "${{ github.sha }}"

  apply:
    name: Apply (${{ matrix.dir }})
    needs: detect
    if: ${{ needs.detect.outputs.nonprod_count != '0' }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        dir: ${{ fromJSON(needs.detect.outputs.nonprod_dirs) }}
    concurrency:
      group: terraform-apply-${{ matrix.dir }}

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: '~> 1.13.0'

      - name: Write OCI API Key File
        run: |
          printf '%s' "${{ secrets.OCI_PRIVATE_KEY }}" > "$RUNNER_TEMP/oci_api_key.pem"
          chmod 600 "$RUNNER_TEMP/oci_api_key.pem"
          echo "TF_VAR_private_key_path=$RUNNER_TEMP/oci_api_key.pem" >> "$GITHUB_ENV"

      - name: Terraform Init
        run: terraform -chdir=${{ matrix.dir }} init -input=false

      - name: Terraform Plan
        run: terraform -chdir=${{ matrix.dir }} plan -out=tfplan -input=false

      - name: Terraform Apply
        run: terraform -chdir=${{ matrix.dir }} apply -input=false tfplan

  apply-prod:
    name: Apply (prod)
    needs: detect
    if: ${{ needs.detect.outputs.prod_count != '0' }}
    runs-on: ubuntu-latest
    environment: prod
    concurrency:
      group: terraform-apply-prod

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: '~> 1.13.0'

      - name: Write OCI API Key File
        run: |
          printf '%s' "${{ secrets.OCI_PRIVATE_KEY }}" > "$RUNNER_TEMP/oci_api_key.pem"
          chmod 600 "$RUNNER_TEMP/oci_api_key.pem"
          echo "TF_VAR_private_key_path=$RUNNER_TEMP/oci_api_key.pem" >> "$GITHUB_ENV"

      - name: Init + Plan + Apply (sequencial por modulo)
        env:
          PROD_DIRS: ${{ needs.detect.outputs.prod_dirs }}
        run: |
          FAILED=()
          APPLIED=()
          for dir in $(echo "$PROD_DIRS" | jq -r '.[]'); do
            echo "::group::${dir}"
            if ! ( terraform -chdir="$dir" init -input=false \
                && terraform -chdir="$dir" plan -out=tfplan -input=false \
                && terraform -chdir="$dir" apply -input=false tfplan ); then
              FAILED+=("$dir")
              echo "::error::Falha no apply do modulo ${dir}"
            else
              APPLIED+=("$dir")
            fi
            echo "::endgroup::"
          done
          if [ "${#FAILED[@]}" -gt 0 ]; then
            echo "::error::Modulos com falha no apply: ${FAILED[*]}"
            exit 1
          fi
          printf '%s\n' "${APPLIED[@]:-}" > "$RUNNER_TEMP/applied-dirs.txt"

      # Provisionamento da VM do runtime via Ansible por SSH — roda só
      # quando o modulo management-api-runtime acabou de aplicar. A chave
      # SSH e as vars saem do terraform output (nada em secrets/inputs).
      - name: Provisionar VM via Ansible (management-api-runtime)
        run: |
          RUNTIME_DIR="infra/terraform/management-api-runtime"
          if ! grep -qx "$RUNTIME_DIR" "$RUNNER_TEMP/applied-dirs.txt"; then
            echo "Modulo $RUNTIME_DIR nao foi aplicado nesta rodada - skip"
            exit 0
          fi

          echo "::group::Ansible — provisionamento da VM"
          python3 -m pip install --quiet -r infra/ansible/requirements.txt

          KEY="$RUNNER_TEMP/mgmt_vm_key"
          terraform -chdir="$RUNTIME_DIR" output -raw ssh_private_key > "$KEY"
          chmod 600 "$KEY"
          terraform -chdir="$RUNTIME_DIR" output -json ansible_vars > "$RUNNER_TEMP/ansible_vars.json"
          DEV_IP=$(terraform -chdir="$RUNTIME_DIR" output -raw vm_dev_public_ip)
          PROD_IP=$(terraform -chdir="$RUNTIME_DIR" output -raw vm_prod_public_ip)
          echo "VM dev: $DEV_IP | VM prod: $PROD_IP"

          for ip in "$DEV_IP" "$PROD_IP"; do
            for i in $(seq 1 30); do
              nc -z "$ip" 22 && break || sleep 10
            done
          done

          export ANSIBLE_CONFIG=infra/ansible/ansible.cfg
          cd infra/ansible
          ansible-playbook -i "${DEV_IP}," -u opc --private-key "$KEY" \
            --extra-vars "@$RUNNER_TEMP/ansible_vars.json" \
            --extra-vars '{"mgmt_envs": ["dev"]}' \
            playbooks/site.yml
          ansible-playbook -i "${PROD_IP}," -u opc --private-key "$KEY" \
            --extra-vars "@$RUNNER_TEMP/ansible_vars.json" \
            --extra-vars '{"mgmt_envs": ["prod"]}' \
            playbooks/site.yml
          echo "::endgroup::"
